name: restforge
description: "A generic Siren hypermedia browser for Android."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # HTTP. dart:io's HttpClient would do, but package:http keeps the request
  # layer testable without a socket — the Pebble app's http.js has the same
  # shape for the same reason.
  http: ^1.2.2

  # Backend definitions minus their secrets. Nothing sensitive goes here.
  shared_preferences: ^2.3.2

  # Secrets, and only secrets. Backed by the Android Keystore via
  # EncryptedSharedPreferences, so an API key is not sitting in a
  # world-readable XML file the way a plain preference would be.
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Imported directly by test/services/quick_service_test.dart to
  # fake a failing platform write (a store whose setValue throws) for the
  # add/remove platform-failure path. A transitive dep of
  # shared_preferences; listed here because the test imports it directly.
  shared_preferences_platform_interface: ^2.4.2

  # Generates the Android launcher icon (mipmaps + adaptive icon) from
  # assets/icon/icon.png below. Not a runtime dependency: it is a build-time
  # tool, invoked by hand with `dart run flutter_launcher_icons` after the
  # source artwork changes, not part of the app itself.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Source artwork for `dart run flutter_launcher_icons`. Rasterised at
# 1024x1024 from ../docs/logo.svg — the project logo, the same mark the
# watchapp ships in its store listing (pebble/store/icon.svg), so both
# apps present as the one product. The background colour below is the
# SVG rect's fill; it is the adaptive icon's background layer and shows
# through the transparent corners of the foreground (the logo's rounded
# square), so update both together if the artwork's background colour
# changes. The logo's mark is sized to sit inside the adaptive-icon safe
# zone, so nothing important is cropped.
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A84FF"
  adaptive_icon_foreground: "assets/icon/icon.png"
